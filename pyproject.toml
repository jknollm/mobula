[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobula"
version = "0.1.0"
description = "Interactive local viewer for high-dimensional cube data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "numpy>=1.26,<3.0",
  "h5py>=3.10,<4.0",
  "astropy>=6.0,<7.0",
  "zarr>=2.18,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "imageio-ffmpeg>=0.5.1,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
]

[project.scripts]
mobula = "mobula.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mobula = ["static/*", "static/**/*"]
