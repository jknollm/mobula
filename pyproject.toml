[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobula"
version = "0.1.0"
description = "Interactive local viewer for high-dimensional cube data, built as an agentically coded project."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "numpy>=1.26,<3.0",
  "h5py>=3.10,<4.0",
  "astropy>=6.0,<7.0",
  "zarr>=2.18,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "imageio-ffmpeg>=0.5.1,<1.0",
]

[project.optional-dependencies]
metal = [
  "torch>=2.6,<3.0; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
native = [
  "torch>=2.6,<3.0; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
  "mypy>=1.11,<2.0",
  "ruff>=0.11,<1.0",
  "playwright>=1.52,<2.0",
]

[project.scripts]
mobula = "mobula.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mobula = ["static/*", "static/**/*"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
  "mobula.data.schema",
  "mobula.service.api_models",
  "mobula.service.api_utils",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
  "astropy.io",
  "h5py",
  "zarr",
]
ignore_missing_imports = true
